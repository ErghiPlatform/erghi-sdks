# Deploys the Docusaurus docs site (docs/) to docs.erghi.ai: S3 + CloudFront, defined in the Erghi
# repo (infrastructure/aws/docs.tf). It was on Cloudflare Pages until 2026-11-27; some Egyptian
# ISPs drop the Cloudflare addresses Pages is served from.
#
# Needs, on this repo:
#   secrets DOCS_AWS_ACCESS_KEY_ID / DOCS_AWS_SECRET_ACCESS_KEY: the key of the docs deploy user
#     (tofu output docs_deploy_user_name), which can only write the docs bucket and clear its cache
#   variables DOCS_S3_BUCKET / DOCS_CLOUDFRONT_DISTRIBUTION_ID (tofu outputs docs_bucket and
#     docs_distribution_id) and AWS_REGION (eu-north-1)
#
# Cache-Control: hashed assets (assets/*) for a year, immutable; everything else browsers
# revalidate on every load, and the edge keeps it until the invalidation at the end.

name: Deploy Docs

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual deploy'

  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: deploy-erghi-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy erghi-docs
    if: vars.DOCS_S3_BUCKET != '' && vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.DOCS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Upload and invalidate
        env:
          BUCKET: ${{ vars.DOCS_S3_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          [ -f build/index.html ] && [ -f build/404.html ] || { echo "Not a docs build" >&2; exit 1; }
          aws s3 sync build/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors
          aws s3 sync build "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=31536000" --only-show-errors
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "Deployed to s3://$BUCKET; invalidation $id completed."
